; TempLab ESP32 - PlatformIO Configuration
; 
; Uso:
;   pio run          - Compilar
;   pio run -t upload - Compilar y cargar al ESP32
;   pio device monitor - Abrir Serial Monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Librerías necesarias
lib_deps = 
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0

; Configuración de particiones (opcional, para más espacio)
; board_build.partitions = default_16MB.csv

; Optimización
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -Wno-deprecated-declarations

; Configuración de upload (ajustar puerto según tu sistema)
; upload_port = COM3  ; Windows
; upload_port = /dev/ttyUSB0  ; Linux/Mac